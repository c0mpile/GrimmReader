# Overrides on top of detekt's default config (buildUponDefaultConfig = true).
style:
  MaxLineLength:
    maxLineLength: 140
  MagicNumber:
    excludes: ['**/test/**', '**/androidTest/**', '**/*Theme.kt', '**/*Palette*.kt', '**/*Colors.kt']
    ignorePropertyDeclaration: true
    ignoreCompanionObjectPropertyDeclaration: true
    ignoreAnnotation: true
    ignoreEnums: true
  UnusedPrivateMember:
    ignoreAnnotated: ['Preview']
  ReturnCount:
    max: 4
naming:
  FunctionNaming:
    ignoreAnnotated: ['Composable']
  TopLevelPropertyNaming:
    constantPattern: '[A-Z][A-Za-z0-9_]*'
complexity:
  LongParameterList:
    functionThreshold: 8
    ignoreDefaultParameters: true
    ignoreAnnotated: ['Composable']
  LongMethod:
    ignoreAnnotated: ['Composable']
  TooManyFunctions:
    ignoreAnnotatedFunctions: ['Composable']
    thresholdInFiles: 20
    thresholdInClasses: 20
    thresholdInInterfaces: 30
