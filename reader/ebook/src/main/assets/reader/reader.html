<!DOCTYPE html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- Books are untrusted and render same-origin (blob: frames inherit this policy): no script but our own. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self' blob: data:; script-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'; connect-src 'self' blob:; style-src 'self' 'unsafe-inline' blob:; img-src 'self' blob: data:; font-src 'self' blob: data:; media-src 'self' blob:; frame-src 'self' blob:">
<style>html, body { margin: 0; height: 100%; overflow: hidden; } foliate-view { display: block; position: fixed; inset: 0; }</style>
<script type="module" src="reader.js"></script>
