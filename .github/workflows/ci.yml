name: CI

on:
  push:
    branches: [main, "scaffold/**"]
  pull_request:

permissions:
  contents: read

jobs:
  leak-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Private strings come from repository secrets into an untracked .env; they never appear in the repo.
      - name: Write .env from secrets
        env:
          SERVER_URL: ${{ secrets.GRIMMREADER_SERVER_URL }}
          FORBIDDEN: ${{ secrets.GRIMMREADER_FORBIDDEN }}
        run: |
          umask 077
          {
            [ -n "$SERVER_URL" ] && printf "GRIMMREADER_SERVER_URL='%s'\n" "$SERVER_URL"
            [ -n "$FORBIDDEN" ] && printf "GRIMMREADER_FORBIDDEN='%s'\n" "$FORBIDDEN"
            true
          } > .env
      - name: Scan tree
        run: scripts/leak-check --tree
