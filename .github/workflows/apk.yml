name: APK

# Builds the debug APK and attaches it to the run as a downloadable artifact.
on:
  push:
    branches: [main, "scaffold/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  debug-apk:
    runs-on: ubuntu-latest
    env:
      # Artifacts are public: never bake the debug server prefill into them.
      GRIMMREADER_SERVER_URL: ""
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v6

      # Optional: a fixed debug key (base64 of a debug.keystore, password "android", alias "androiddebugkey") so
      # each build installs over the previous one. Without it every run signs with a fresh key.
      - name: Debug signing key
        env:
          DEBUG_KEYSTORE: ${{ secrets.GRIMMREADER_DEBUG_KEYSTORE }}
        run: |
          if [ -n "$DEBUG_KEYSTORE" ]; then
            mkdir -p ~/.android
            umask 077
            printf '%s' "$DEBUG_KEYSTORE" | base64 --decode > ~/.android/debug.keystore
            echo "Signing with the stable debug key."
          else
            echo "No GRIMMREADER_DEBUG_KEYSTORE secret: signing with a one-off debug key."
          fi

      - name: Build
        run: ./gradlew assembleDebug --console=plain

      - name: Name the APK
        id: apk
        run: |
          version=$(sed -n 's/^ *versionName = "\(.*\)"/\1/p' app/build.gradle.kts)
          name="GrimmReader-${version}-$(git rev-parse --short HEAD)-debug"
          mkdir -p out
          cp app/build/outputs/apk/debug/*.apk "out/${name}.apk"
          echo "name=${name}" >> "$GITHUB_OUTPUT"
          {
            echo "### ${name}.apk"
            echo '```'
            (cd out && sha256sum "${name}.apk")
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.apk.outputs.name }}
          path: out/${{ steps.apk.outputs.name }}.apk
          if-no-files-found: error
          retention-days: 30
